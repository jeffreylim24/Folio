name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Engine tests
        working-directory: engine
        run: uv run pytest -q

      - name: Engine lint
        working-directory: engine
        run: uv run ruff check

      - name: Build engine sidecar
        shell: bash
        run: bash scripts/build-engine.sh

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: App tests
        working-directory: app
        run: npm test

      # The Rust shell embeds the built frontend and needs the sidecar binary.
      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Shell tests
        working-directory: app/src-tauri
        run: cargo test

      - name: Engine smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/ci-windows-smoke.sh

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Folio {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: folio-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
